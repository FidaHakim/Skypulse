<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkyPulse AI Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; }
        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .weather-bg-day { background: linear-gradient(to bottom, #3b82f6, #93c5fd); }
        .weather-bg-night { background: linear-gradient(to bottom, #0f172a, #1e1b4b); }
        
        /* Dynamic Backgrounds */
        .weather-clear-day { background: linear-gradient(135deg, #3b82f6, #60a5fa); background-size: 200% 200%; animation: moveGradient 15s ease infinite; }
        .weather-clear-night { background: linear-gradient(135deg, #090e17, #1e1b4b); background-size: 200% 200%; animation: moveGradient 15s ease infinite; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="weather-bg-day min-h-screen text-white font-sans p-2 sm:p-4 transition-all duration-1000">

    <div class="w-full max-w-4xl mx-auto glass-panel rounded-3xl p-4 sm:p-6 shadow-2xl">
        <!-- Header Section -->
        <div class="flex flex-col gap-4 border-b border-white/10 pb-4 mb-6">
            <h1 class="text-2xl font-extrabold flex items-center gap-2">
                <i data-lucide="cloud-sun" class="text-amber-300"></i> SkyPulse
            </h1>
            
            <div class="flex flex-wrap gap-2">
                <div class="relative flex-grow">
                    <input type="text" id="cityInput" placeholder="Search city..."
                           class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-2.5 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-white/40">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 opacity-50"></i>
                </div>
                <button id="searchBtn" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl text-sm font-medium">Go</button>
                <button id="geoBtn" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl"><i data-lucide="map-pin" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div id="loader" class="text-center py-20"><div class="animate-spin inline-block h-10 w-10 border-4 border-white/20 border-t-white rounded-full"></div></div>

        <div id="weatherContent" class="hidden">
            <!-- Current Weather -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="md:col-span-1 glass-panel p-6 rounded-2xl text-center">
                    <h2 id="locationName" class="text-xl font-bold truncate">--</h2>
                    <i id="mainWeatherIcon" data-lucide="sun" class="w-20 h-20 mx-auto my-4 text-amber-300"></i>
                    <span id="currentTemp" class="text-5xl font-black">--°</span>
                    <p id="weatherCondition" class="mt-2 text-sm opacity-80">--</p>
                </div>

                <div class="md:col-span-2 grid grid-cols-2 gap-3">
                    <!-- Weather Stats -->
                    <div class="glass-panel p-4 rounded-xl">
                        <p class="text-[10px] uppercase opacity-70">Feels Like</p>
                        <h3 id="feelsLike" class="font-bold text-lg">--</h3>
                    </div>
                    <div class="glass-panel p-4 rounded-xl">
                        <p class="text-[10px] uppercase opacity-70">Humidity</p>
                        <h3 id="humidity" class="font-bold text-lg">--</h3>
                    </div>
                    <div class="glass-panel p-4 rounded-xl">
                        <p class="text-[10px] uppercase opacity-70">Wind</p>
                        <h3 id="windSpeed" class="font-bold text-lg">--</h3>
                    </div>
                    <div class="glass-panel p-4 rounded-xl">
                        <p class="text-[10px] uppercase opacity-70">UV Index</p>
                        <h3 id="uvIndex" class="font-bold text-lg">--</h3>
                    </div>
                </div>
            </div>

            <!-- Forecast -->
            <div class="overflow-x-auto pb-2 custom-scrollbar">
                <div id="forecastContainer" class="flex gap-3 min-w-max">
                    <!-- Forecast items injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ... (Keep your existing JavaScript logic)
        // Ensure to call lucide.createIcons() after dynamic updates
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            runAutoGeolocation();
        });
        // ... (Rest of your script)
    </script>
</body>
</html>
