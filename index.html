<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Advanced Local Weather App with SkyPulse AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; touch-action: manipulation; overflow-x: hidden; }
        @keyframes moveGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .weather-bg-day{background:linear-gradient(to bottom,#3b82f6,#93c5fd);transition:all 0.5s ease}
        .weather-bg-night{background:linear-gradient(to bottom,#0f172a,#1e1b4b);transition:all 0.5s ease}
        .weather-clear-day{background:linear-gradient(135deg,#3b82f6,#60a5fa,#93c5fd);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .weather-clear-night{background:linear-gradient(135deg,#090e17,#111827,#1e1b4b);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .weather-clouds-day{background:linear-gradient(135deg,#64748b,#94a3b8,#cbd5e1);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .weather-clouds-night{background:linear-gradient(135deg,#1e293b,#334155,#0f172a);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .weather-rain{background:linear-gradient(135deg,#1e3a8a,#312e81,#0f172a);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .weather-snow{background:linear-gradient(135deg,#7dd3fc,#38bdf8,#64748b);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .weather-storm{background:linear-gradient(135deg,#374151,#111827,#000000);background-size:200% 200%;animation:moveGradient 15s ease infinite}
        .glass-panel{background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2)}
        .glass-depth{box-shadow:0 40px 80px -15px rgba(0,0,0,0.5),inset 0 2px 4px rgba(255,255,255,0.4),inset 0 -2px 4px rgba(0,0,0,0.3);transform:translateZ(0)}
        .icon-depth{filter:drop-shadow(0 15px 20px rgba(0,0,0,0.5)) drop-shadow(0 0 10px rgba(255,255,255,0.2))}
        .custom-scrollbar::-webkit-scrollbar{width:6px}.custom-scrollbar::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:10px}.custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:10px}.custom-scrollbar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.3)}
    </style>
</head>
<body class="weather-bg-day min-h-[100dvh] text-white font-sans flex items-center justify-center p-2 sm:p-4 md:p-8 transition-all duration-1000 overflow-y-auto">
    <div class="w-full max-w-4xl glass-panel glass-depth rounded-3xl p-4 sm:p-6 md:p-8 shadow-2xl relative overflow-hidden my-auto">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-white/10 pb-6 mb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2"><i data-lucide="cloud-sun" class="w-8 h-8 text-amber-300 animate-pulse"></i> SkyPulse</h1>
                <p class="text-xs sm:text-sm text-white/70 mt-1">Real-time hyperlocal weather & AI Assistant</p>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                <div class="relative flex-1 min-w-[140px] lg:w-64">
                    <input type="text" id="cityInput" placeholder="Search city..." class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl px-4 py-2 pl-10 focus:outline-none focus:ring-2 focus:ring-white/40 text-sm">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-white/50"></i>
                </div>
                <button id="searchBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl transition font-medium text-sm">Go</button>
                <button id="geoBtn" title="Use current location" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl transition"><i data-lucide="map-pin" class="w-5 h-5"></i></button>
                <button id="unitToggle" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-2 rounded-xl transition text-sm whitespace-nowrap">Switch Units</button>
            </div>
        </div>
        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/40 rounded-xl p-3 mb-6 text-sm text-center"></div>
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white/20 border-t-white"></div>
            <p class="mt-4 text-white/80 animate-pulse">Fetching latest data...</p>
        </div>
        <div id="weatherContent" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="md:col-span-1 flex flex-col items-center justify-center text-center p-6 bg-white/5 rounded-2xl border border-white/10">
                    <h2 id="locationName" class="text-xl sm:text-2xl font-bold tracking-wide">--</h2>
                    <p id="localTime" class="text-xs text-white/60 mb-4"></p>
                    <div class="relative my-2"><i id="mainWeatherIcon" data-lucide="sun" class="w-20 h-20 sm:w-24 sm:h-24 text-amber-300 drop-shadow-md icon-depth"></i></div>
                    <span id="currentTemp" class="text-5xl sm:text-6xl font-black tracking-tighter my-2">--</span>
                    <span id="weatherCondition" class="text-xs sm:text-sm font-medium px-3 py-1 bg-white/10 rounded-full">--</span>
                </div>
                <div class="md:col-span-2 grid grid-cols-2 gap-3 sm:gap-4">
                    <div class="glass-panel p-3 sm:p-4 rounded-2xl flex items-center gap-3"><div class="p-2 sm:p-3 bg-white/10 rounded-xl"><i data-lucide="thermometer" class="text-orange-300 w-5 h-5"></i></div><div><p class="text-[10px] sm:text-xs text-white/60 font-medium">Feels Like</p><h3 id="feelsLike" class="text-sm sm:text-xl font-bold">--</h3></div></div>
                    <div class="glass-panel p-3 sm:p-4 rounded-2xl flex items-center gap-3"><div class="p-2 sm:p-3 bg-white/10 rounded-xl"><i data-lucide="droplets" class="text-blue-300 w-5 h-5"></i></div><div><p class="text-[10px] sm:text-xs text-white/60 font-medium">Humidity</p><h3 id="humidity" class="text-sm sm:text-xl font-bold">--</h3></div></div>
                    <div class="glass-panel p-3 sm:p-4 rounded-2xl flex items-center gap-3"><div class="p-2 sm:p-3 bg-white/10 rounded-xl"><i data-lucide="wind" class="text-teal-300 w-5 h-5"></i></div><div><p class="text-[10px] sm:text-xs text-white/60 font-medium">Wind</p><h3 id="windSpeed" class="text-sm sm:text-xl font-bold">--</h3></div></div>
                    <div class="glass-panel p-3 sm:p-4 rounded-2xl flex items-center gap-3"><div class="p-2 sm:p-3 bg-white/10 rounded-xl"><i data-lucide="umbrella" class="text-indigo-300 w-5 h-5"></i></div><div><p class="text-[10px] sm:text-xs text-white/60 font-medium">Precip</p><h3 id="precipitation" class="text-sm sm:text-xl font-bold">--</h3></div></div>
                    <div class="glass-panel p-3 sm:p-4 rounded-2xl col-span-2 flex items-center justify-between px-4 sm:px-6 gap-4"><div class="flex items-center gap-3"><div class="p-2 sm:p-3 bg-white/10 rounded-xl"><i data-lucide="sun-dim" class="text-yellow-400 w-5 h-5"></i></div><div><p class="text-[10px] sm:text-xs text-white/60 font-medium">UV Index</p><h3 id="uvIndex" class="text-sm sm:text-xl font-bold">--</h3></div></div><span id="uvRisk" class="text-[10px] sm:text-xs font-semibold px-2 py-1 rounded-md bg-white/10">--</span></div>
                </div>
            </div>
            <div class="glass-panel rounded-2xl p-5 mb-8 border border-white/20">
                <h3 class="text-lg font-bold mb-3 flex items-center gap-2"><i data-lucide="info" class="w-5 h-5 text-sky-300"></i> Weather Insight</h3>
                <p id="weatherInsight" class="text-sm text-white/80 leading-relaxed italic">Analyzing current atmospheric conditions to provide you with a brief summary...</p>
            </div>
            <div class="glass-panel rounded-2xl p-5 mb-8 border border-white/20">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-bold flex items-center gap-2"><i data-lucide="sparkles" class="w-5 h-5 text-amber-300"></i> Ask SkyPulse AI</h3>
                    <a href="https://askmeplus.edgeone.app" target="_blank" class="text-xs font-medium bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg flex items-center gap-1 transition decoration-none text-white"><i data-lucide="plus-circle" class="w-3.5 h-3.5 text-amber-300"></i> More</a>
                </div>
                <div class="flex flex-col gap-2">
                    <input type="text" id="aiInput" placeholder="Ask about clothing, travel, etc..." class="w-full bg-black/20 border border-white/10 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-300/50">
                    <button id="askAiBtn" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2"><span>Ask AI</span><i data-lucide="send" class="w-4 h-4"></i></button>
                </div>
                <div id="aiResponseBox" class="hidden mt-4 bg-black/20 border border-white/5 rounded-xl p-4 max-h-40 overflow-y-auto text-sm custom-scrollbar text-white/90"></div>
            </div>
            <div class="grid-span-full"><h3 class="text-lg font-bold mb-4">15-Day Forecast</h3><div id="forecastContainer" class="flex overflow-x-auto gap-3 pb-4 custom-scrollbar"></div></div>
        </div>
    </div>
    <script>
        let isMetric=true,activeLat=51.5074,activeLon=-0.1278,currentCityName="London";
        const loader=document.getElementById('loader'),weatherContent=document.getElementById('weatherContent'),aiResponseBox=document.getElementById('aiResponseBox');
        window.addEventListener('DOMContentLoaded',()=>{
            runAutoGeolocation();
            document.getElementById('searchBtn').addEventListener('click',handleCitySearch);
            document.getElementById('cityInput').addEventListener('keypress',(e)=>{if(e.key==='Enter')handleCitySearch();});
            document.getElementById('geoBtn').addEventListener('click',runAutoGeolocation);
            document.getElementById('unitToggle').addEventListener('click',()=>{isMetric=!isMetric;fetchWeatherData(activeLat,activeLon);});
            document.getElementById('askAiBtn').addEventListener('click',handleAiQuery);
        });
        function runAutoGeolocation(){
            if(navigator.geolocation){
                navigator.geolocation.getCurrentPosition((p)=>{activeLat=p.coords.latitude;activeLon=p.coords.longitude;currentCityName="Current Location";fetchWeatherData(activeLat,activeLon);},()=>fetchWeatherData(activeLat,activeLon));
            }else fetchWeatherData(activeLat,activeLon);
        }
        async function handleCitySearch(){
            const query=document.getElementById('cityInput').value.trim();
            if(!query)return;
            const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`);
            const data=await res.json();
            if(data.results){activeLat=data.results[0].latitude;activeLon=data.results[0].longitude;currentCityName=data.results[0].name;fetchWeatherData(activeLat,activeLon);}
        }
        async function fetchWeatherData(lat,lon){
            loader.classList.remove('hidden');weatherContent.classList.add('hidden');
            const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16&temperature_unit=${isMetric?'celsius':'fahrenheit'}&wind_speed_unit=${isMetric?'kmh':'mph'}`;
            const res=await fetch(url);
            const data=await res.json();
            render(data);
        }
        function render(data){
            const c=data.current,d=data.daily,m=interpret(c.weather_code,c.is_day);
            document.body.className=`${c.is_day===1?m.bgDay:m.bgNight} min-h-[100dvh] text-white p-2 sm:p-4 transition-all duration-1000 overflow-y-auto`;
            document.getElementById('locationName').innerText=currentCityName;
            document.getElementById('currentTemp').innerText=`${Math.round(c.temperature_2m)}${isMetric?"°C":"°F"}`;
            document.getElementById('feelsLike').innerText=`${Math.round(c.apparent_temperature)}°`;
            document.getElementById('humidity').innerText=`${c.relative_humidity_2m}%`;
            document.getElementById('windSpeed').innerText=`${c.wind_speed_10m}${isMetric?"km/h":"mph"}`;
            document.getElementById('precipitation').innerText=`${c.precipitation} mm`;
            document.getElementById('uvIndex').innerText=c.uv_index.toFixed(1);
            document.getElementById('weatherCondition').innerText=m.label;
            document.getElementById('weatherInsight').innerText=`It is currently ${m.label.toLowerCase()} in ${currentCityName}. Expect a high of ${Math.round(d.temperature_2m_max[0])}° and a low of ${Math.round(d.temperature_2m_min[0])}°.`;
            const iconEl = document.getElementById('mainWeatherIcon');
            iconEl.setAttribute('data-lucide', m.icon);
            const fc=document.getElementById('forecastContainer');
            fc.innerHTML='';
            for(let i=1;i<d.time.length;i++){
                const dayM=interpret(d.weather_code[i],1);
                fc.innerHTML+=`<div class="flex-shrink-0 w-20 bg-white/5 border border-white/10 rounded-xl p-3 text-center"><p class="text-[10px] font-bold">${new Date(d.time[i]).toLocaleDateString('en-US',{weekday:'short'})}</p><i data-lucide="${dayM.icon}" class="w-6 h-6 my-2 mx-auto"></i><p class="text-xs font-bold">${Math.round(d.temperature_2m_max[i])}°</p></div>`;
            }
            loader.classList.add('hidden');
            weatherContent.classList.remove('hidden');
            lucide.createIcons();
        }
        async function handleAiQuery(){
            const prompt=document.getElementById('aiInput').value.trim();
            if(!prompt)return;
            aiResponseBox.classList.remove('hidden');
            aiResponseBox.innerText="Consulting AI...";
            const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent("Weather in "+currentCityName+": "+prompt)}`);
            aiResponseBox.innerText=await res.text();
        }
        function interpret(c,day){
            if(c===0) return {label:"Clear",icon:day?"sun":"moon",bgDay:"weather-clear-day",bgNight:"weather-clear-night"};
            if(c>=1&&c<=3) return {label:"Cloudy",icon:"cloud",bgDay:"weather-clouds-day",bgNight:"weather-clouds-night"};
            if(c>=51&&c<=67) return {label:"Rain",icon:"cloud-rain",bgDay:"weather-rain",bgNight:"weather-rain"};
            if(c>=71&&c<=77) return {label:"Snow",icon:"snowflake",bgDay:"weather-snow",bgNight:"weather-snow"};
            if(c>=95) return {label:"Storm",icon:"cloud-lightning",bgDay:"weather-storm",bgNight:"weather-storm"};
            return {label:"Overcast",icon:"cloud",bgDay:"weather-clouds-day",bgNight:"weather-clouds-night"};
        }
    </script>
</body>
</html>
